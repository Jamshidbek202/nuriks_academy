services:
  mongo-finance-qa:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (error) {
          rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo-finance-qa:27017"}]}).ok }'
          | grep 1
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
